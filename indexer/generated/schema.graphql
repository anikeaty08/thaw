}

type Meta {
  status: JSON
}

type Query {
  loan(id: BigInt!): loan
  loans(where: loanFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): loanPage!
  harvestEvent(id: String!): harvestEvent
  harvestEvents(where: harvestEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): harvestEventPage!
  voteEvent(id: String!): voteEvent
  voteEvents(where: voteEventFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): voteEventPage!
  vaultFlow(id: String!): vaultFlow
  vaultFlows(where: vaultFlowFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): vaultFlowPage!
  auction(id: BigInt!): auction
  auctions(where: auctionFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): auctionPage!
  strategyPost(id: String!): strategyPost
  strategyPosts(where: strategyPostFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): strategyPostPage!
  lender(id: String!): lender
  lenders(where: lenderFilter, orderBy: String, orderDirection: String, before: String, after: String, limit: Int): lenderPage!
  _meta: Meta
}

