name: Bot notify

# The Telegram bot itself runs as a Vercel webhook (apps/bot/api/webhook.ts) and only answers
# commands. Its two proactive jobs — the weekly epoch report and the liquidation-warning sweep —
# used to be an in-process cron in src/index.ts; they move here for the same reason as keeper.yml:
# a Vercel function has no persistent process to run a cron on. See DEPLOYMENT.md.
on:
  schedule:
    - cron: "0 7 * * 4"    # Thursday 07:00 UTC — epoch report, after the keeper's harvest window
    - cron: "*/15 * * * *" # every 15 min — liquidation warnings
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run manually"
        required: true
        type: choice
        options: [epoch, warnings]
        default: warnings

concurrency:
  group: thaw-bot-notify
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/bot
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      DATABASE_URL: ${{ secrets.BOT_DATABASE_URL }}
      RPC_URL: ${{ vars.RPC_URL || 'https://rpc.test.mezo.org' }}
      CHAIN_ID: ${{ vars.CHAIN_ID || '31611' }}
      LOAN_MANAGER_ADDRESS: ${{ vars.LOAN_MANAGER_ADDRESS }}
      INDEXER_URL: ${{ vars.INDEXER_URL }}
      WEBAPP_URL: ${{ vars.WEBAPP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/bot/package-lock.json
      - run: npm ci
      - name: Decide which job this run is
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 4" ]; then
            echo "job=epoch" >> "$GITHUB_OUTPUT"
          else
            echo "job=warnings" >> "$GITHUB_OUTPUT"
          fi
      - name: Epoch report
        if: steps.which.outputs.job == 'epoch'
        run: npm run notify:epoch
      - name: Liquidation warnings
        if: steps.which.outputs.job == 'warnings'
        run: npm run notify:warnings
